name: Build and Release iOS App to TestFlight

on:
  workflow_dispatch:

jobs:
  release-ios:
    name: Build & Release iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Warning: Xcode 26 not found. Current version is:"
            xcodebuild -version
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Fix App ID for iOS release
        run: |
          cat << 'EOF' > fix-app-id.cjs
          const fs = require('fs');
          const files = ['capacitor.config.ts', 'capacitor.config.json'];
          files.forEach(file => {
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, 'utf8');
              if (file.endsWith('.ts')) {
                content = content.replace(/appId:\s*['"][^'"]+['"]/, "appId: 'com.docutrace.app'");
              } else {
                content = content.replace(/"appId"\s*:\s*"[^"]+"/, '"appId": "com.docutrace.app"');
              }
              fs.writeFileSync(file, content);
              console.log(`Updated ${file} to use com.docutrace.app`);
            }
          });
          EOF
          node fix-app-id.cjs
          rm fix-app-id.cjs

      - name: Add and Sync Capacitor iOS
        run: |
          if [ ! -d "./ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Inject GoogleService-Info.plist into iOS project
        run: |
          # Ensure the Firebase plist is present in the generated iOS app folder
          cp native-config/ios/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

          # Register the plist inside the Xcode project so it is bundled in the IPA
          gem install xcodeproj --no-document
          cat << 'RUBY' > add-plist.rb
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target  = project.targets.find { |t| t.name == 'App' }
          group   = project.main_group.find_subpath('App', true)
          file    = 'GoogleService-Info.plist'
          unless group.files.any? { |f| f.path == file }
            ref = group.new_reference(file)
            target.add_resources([ref])
            project.save
            puts "Added #{file} to Xcode project"
          else
            puts "#{file} already present in Xcode project"
          end
          RUBY
          ruby add-plist.rb
          rm add-plist.rb

      - name: Setup App Store Connect API Private Key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Unlock Keychain
        run: |
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db

      - name: Build & Archive iOS App
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPSTORE_TEAM_ID }}

      - name: Inject Team ID into ExportOptions
        run: |
          node -e "
          const fs = require('fs');
          let plist = fs.readFileSync('ExportOptions.plist', 'utf8');
          plist = plist.replace('</dict>', '  <key>teamID</key>\n  <string>${{ secrets.APPSTORE_TEAM_ID }}</string>\n</dict>');
          fs.writeFileSync('ExportOptions.plist', plist);
          console.log('Injected Team ID into ExportOptions.plist');
          "

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          IPA_PATH=$(find build -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file not found in build directory!"
            exit 1
          fi
          echo "Uploading IPA found at: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
